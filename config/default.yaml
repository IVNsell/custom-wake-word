# Wake word platform configuration

phrase:
  max_words: 3
  max_duration_sec: 2.5

recordings:
  min_count: 3
  max_count: 10
  recommended_count: 7
  sample_rate: 16000
  channels: 1
  hints:
    - "Normal voice, 30-50 cm from the microphone"
    - "Slightly quieter / slightly louder"
    - "A bit faster / a bit slower"
    - "Turn your head slightly to the side"

training:
  # 3 recordings x 80 ≈ 240 positives; 10 x 80 ≈ 800
  augmentation_rounds: 80
  train_split: 0.85
  steps: 35000
  layer_size: 32
  model_type: dnn
  target_false_positives_per_hour: 0.2
  max_negative_weight: 1500
  # Auto-mine confusers from shared_negatives.npy (similar speech/noise, no named words)
  mine_confusers: true
  confuser_top_k: 2500
  confuser_weight: 4000
  confuser_batch: 384
  optional_tts_positives: 2000

paths:
  negatives_root: data/negatives
  negatives_features: data/features/shared_negatives.npy
  catalog_dir: catalog/models
  catalog_manifest: catalog/manifest.json
  user_recordings: workspace/recordings
  hard_negatives: workspace/hard_negatives
  user_output: output/user_models
  temp_training: workspace/training

inference:
  sample_rate: 16000
  frame_samples: 1280  # 80 ms — openWakeWord minimum step
  threshold: 0.5
  # 1 ≈ 80 ms (fast), 2 ≈ 160 ms, 3 ≈ 240 ms (stable)
  trigger_frames: 2
  refractory_sec: 2.0
